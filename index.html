<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Atleta - CFA Prosol</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#58111a">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="portal-inactivity-clock" class="portal-inactivity-clock" title="Tempo para atualização automática">↻ 05:00</div>
  <button id="portal-fullscreen-btn" class="portal-fullscreen-btn" onclick="togglePortalFullScreen()" title="Tela cheia">⛶ Tela Cheia</button>
  <div id="portal-action-panel" class="portal-action-panel"><div id="portal-action-buttons" class="portal-action-buttons"><button id="portal-btn-psr" onclick="abrirModalPSR()" title="Percepção Subjetiva de Recuperação">PSR</button><button id="portal-btn-pse" onclick="abrirModalPSE()" title="Percepção Subjetiva de Esforço">PSE</button></div></div>
  <div id="portal-documentos-buttons" class="portal-documentos-buttons"><button id="portal-btn-trabalho" onclick="abrirTrabalhoDiarioPortal()">Trabalho diário</button><button id="portal-btn-planejamento" onclick="abrirPlanejamentoSemanalPortal()">Planejamento Semanal</button></div>

  <main id="app">
    <section id="login-screen" class="screen active">
      <div class="login-card">
        <div class="login-portal-title">Portal do Atleta</div>
        <img src="logo.png" class="login-logo" alt="CFA Prosol">
        <h1>CFA Prosol</h1>
        <p>Sistema de Organização Metodológica</p>

        <div class="login-fields">
          <label>
            Ano
            <select id="login-ano"></select>
          </label>

          <label>
            Atleta
            <select id="login-atleta"></select>
          </label>

          <label>
            Senha
            <input type="password" id="login-senha" placeholder="Digite sua senha">
          </label>
        </div>

        <button id="btn-login" onclick="entrarPortalAtleta()">ENTRAR</button>
        <div id="login-msg" class="login-msg"></div>
        <div class="login-credit">Criado por: Vinícius Bolonheze</div>
      </div>
    </section>

    <section id="ficha-screen" class="screen">
      <header class="portal-header">
        <img src="logo.png" alt="CFA Prosol">
        <div class="portal-title-block">
          <strong>Portal do Atleta</strong>
          <span id="portal-atleta-logado"></span>
          <span id="portal-horario-info" class="portal-horario-info">PSR - 06:00 as 15:00  PSE: 16:00 as 23:00</span>
        </div>
        <button class="portal-sair-btn" onclick="sairPortalAtleta()">Sair</button>
      </header>

      <div id="ficha-container"></div>
    </section>
  </main>

  <script src="script.js?v=portal-atleta-v11-data-referencia"></script>

</html>
